[project]
name = "home-iptv"
version = "0.1.0"
description = "Personal self-hosted IPTV ingest, index, and restream."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.12",
  "segno>=1.6,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "playwright>=1.48,<2",
]

[project.scripts]
home-iptv = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]
