services:
  prepare:
    image: ghcr.io/davidmcferrin-spec/home-iptv:latest
    command: ["python", "-m", "app.mediamtx_config"]
    environment:
      PUID: ${PUID:-99}
      PGID: ${PGID:-100}
    volumes:
      - ${CONFIG_PATH:-/mnt/user/appdata/home-iptv/config}:/config
    restart: "no"

  mediamtx:
    image: bluenviron/mediamtx:1.16.2
    command: ["/mediamtx-config/mediamtx.yml"]
    volumes:
      - ${CONFIG_PATH:-/mnt/user/appdata/home-iptv/config}:/mediamtx-config:ro
    depends_on:
      prepare:
        condition: service_completed_successfully
    ports:
      - "${HLS_PORT:-8888}:8888"
      - "${WEBRTC_PORT:-8889}:8889"
      - "${WEBRTC_UDP_PORT:-8189}:8189/udp"
      - "${WEBRTC_UDP_PORT:-8189}:8189/tcp"
      - "${RTSP_PORT:-8554}:8554"
    # Scratch image: no shell and no HTTP client. A bad config exits the process.
    healthcheck:
      test: ["CMD", "/mediamtx", "--version"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    restart: unless-stopped

  app:
    image: ghcr.io/davidmcferrin-spec/home-iptv:latest
    ports:
      - "${WEB_PORT:-9595}:8080"
      - "${HDHR_UDP_PORT:-65001}:65001/udp"
    environment:
      PUID: ${PUID:-99}
      PGID: ${PGID:-100}
      EMBED_WORKER: "0"
      EMBED_HUB: "1"
      EMBED_DISCOVERY: "1"
      DATABASE_PATH: /config/home-iptv.sqlite
      DATA_DIR: /data
      MEDIAMTX_API: http://mediamtx:9997
      MEDIAMTX_RTSP: rtsp://mediamtx:8554
      WEB_PORT: ${WEB_PORT:-9595}
      WEBRTC_PORT: ${WEBRTC_PORT:-8889}
      WEBRTC_UDP_PORT: ${WEBRTC_UDP_PORT:-8189}
      HLS_PORT: ${HLS_PORT:-8888}
    volumes:
      - ${CONFIG_PATH:-/mnt/user/appdata/home-iptv/config}:/config
      - ${DATA_PATH:-/mnt/user/appdata/home-iptv/data}:/data
      - ${MEDIA_PATH:-/mnt/user/media}:/media:ro
    depends_on:
      mediamtx:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 8s
    restart: unless-stopped

  worker:
    image: ghcr.io/davidmcferrin-spec/home-iptv:latest
    command: ["python", "-m", "app.worker"]
    environment:
      PUID: ${PUID:-99}
      PGID: ${PGID:-100}
      EMBED_WORKER: "1"
      EMBED_HUB: "0"
      EMBED_DISCOVERY: "0"
      DATABASE_PATH: /config/home-iptv.sqlite
      DATA_DIR: /data
    volumes:
      - ${CONFIG_PATH:-/mnt/user/appdata/home-iptv/config}:/config
      - ${DATA_PATH:-/mnt/user/appdata/home-iptv/data}:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib; raise SystemExit(0 if b'app.worker' in pathlib.Path('/proc/1/cmdline').read_bytes() else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 8s
    restart: unless-stopped
