<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home IPTV</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script>
    (function () {
      var w = window.innerWidth;
      var h = window.innerHeight;
      var phone = w <= 720 || (h <= 500 && w <= 980);
      document.documentElement.classList.toggle("is-phone", phone);
    })();
  </script>
</head>
<body>
  <div id="shell">
    <div id="stage">
      <video id="video" autoplay playsinline muted></video>
      <div id="stage-bars" aria-hidden="true"></div>
      <div id="stage-chrome">
        <div id="stage-label">Live</div>
        <button id="sound" type="button">Sound</button>
      </div>
    </div>
    <div id="dim" hidden></div>
    <div id="frame">
    <header id="topbar">
      <div id="chips" role="tablist" aria-label="Filters"></div>
      <div id="clock-block">
        <div id="clock-time">
          <span id="clock">--:--</span>
          <span id="meridian">--</span>
          <span id="now-mark" aria-hidden="true"></span>
        </div>
        <div id="clock-date">
          <div id="weekday">--</div>
          <div id="monthday">--</div>
        </div>
      </div>
    </header>
    <section id="info" aria-live="polite">
      <div id="info-copy">
        <p id="info-kicker"></p>
        <h1 id="info-title">Guide</h1>
        <p id="info-episode"></p>
        <p id="info-meta"></p>
        <p id="info-desc"></p>
      </div>
      <div id="preview"></div>
    </section>
    <div id="phone-tools">
      <button id="view-list" type="button">List</button>
      <button id="view-grid" type="button">Grid</button>
    </div>
    <div id="phone-list"></div>
    <div id="guide-scroll">
      <div id="guide"></div>
    </div>
    </div>
    <div id="hint">
      <span id="hint-text">Arrows move · Enter watch · 0-9 tune · PgUp channel</span>
      <button id="ch-down" type="button">CH-</button>
      <button id="ch-up" type="button">CH+</button>
      <button id="open-import" type="button">Sources</button>
      <button id="open-settings" type="button">Settings</button>
    </div>
  </div>
  <button id="back-guide" type="button" hidden>Guide</button>
  <div id="toast" hidden></div>
  <div id="number-entry" hidden></div>
  <div id="import" hidden>
    <div id="import-panel">
      <h2>Sources</h2>
      <form id="upload-form">
        <button id="choose-file" type="button">Choose M3U file</button>
        <input id="upload-file" type="file" accept=".m3u,.m3u8,audio/mpegurl,application/vnd.apple.mpegurl" hidden>
        <span id="upload-filename"></span>
        <label>Name
          <input id="upload-name" type="text" maxlength="120" autocomplete="off">
        </label>
        <button type="submit">Upload</button>
      </form>
      <form id="url-form">
        <label>Playlist URL
          <input id="playlist-url" type="url" inputmode="url" autocomplete="off" placeholder="https://">
        </label>
        <label>Name
          <input id="url-name" type="text" maxlength="120" autocomplete="off">
        </label>
        <label>Re-import every (minutes)
          <input id="url-interval" type="number" inputmode="numeric" min="5" max="10080" placeholder="Optional">
        </label>
        <button type="submit">Add playlist</button>
      </form>
      <form id="hdhr-form">
        <label>HDHomeRun IP or address
          <input id="hdhr-host" type="text" autocomplete="off" placeholder="192.168.1.50">
        </label>
        <button type="submit">Add tuner</button>
      </form>
      <p id="import-error" role="alert"></p>
      <div id="playlist-list"></div>
      <div id="device-list"></div>
      <button id="close-import" type="button">Close</button>
    </div>
  </div>
  <div id="settings" hidden>
    <form id="settings-form">
      <h2>Default view</h2>
      <label>Country
        <select id="set-country"></select>
      </label>
      <fieldset>
        <legend>Languages</legend>
        <div id="set-languages"></div>
      </fieldset>
      <fieldset>
        <legend>Tags</legend>
        <div id="set-tags"></div>
      </fieldset>
      <label>Sort
        <select id="set-sort">
          <option value="number">Channel number</option>
          <option value="title">Title</option>
          <option value="language">Language</option>
          <option value="country">Country</option>
          <option value="status">Status</option>
        </select>
      </label>
      <label>Starting channel
        <select id="set-start"></select>
      </label>
      <h2>Server</h2>
      <label>Public HTTP base
        <input id="set-http-base" type="url" placeholder="Detected from the browser" autocomplete="off">
      </label>
      <label>Public WebRTC base
        <input id="set-webrtc-base" type="url" placeholder="Detected from the browser" autocomplete="off">
      </label>
      <label>Public HLS base
        <input id="set-hls-base" type="url" placeholder="Detected from the browser" autocomplete="off">
      </label>
      <label>WebRTC host
        <input id="set-webrtc-host" type="text" placeholder="Detected LAN address" autocomplete="off">
      </label>
      <label>Verify concurrency
        <input id="set-verify-concurrency" type="number" min="1" inputmode="numeric" value="4">
      </label>
      <label>Verify timeout (seconds)
        <input id="set-verify-timeout" type="number" min="3" inputmode="numeric" value="20">
      </label>
      <label>Verify interval (minutes)
        <input id="set-verify-interval" type="number" min="5" inputmode="numeric" value="360">
      </label>
      <label>Idle timeout (seconds)
        <input id="set-idle" type="number" min="5" inputmode="numeric" value="60">
      </label>
      <label class="check">
        <input id="set-emulation" type="checkbox">
        HDHomeRun emulation
      </label>
      <p id="port-note"></p>
      <label>Guide port
        <input id="port-http" type="text" readonly>
      </label>
      <label>WebRTC port
        <input id="port-webrtc" type="text" readonly>
      </label>
      <label>WebRTC UDP port
        <input id="port-webrtc-udp" type="text" readonly>
      </label>
      <label>HLS port
        <input id="port-hls" type="text" readonly>
      </label>
      <label class="check">
        <input id="set-adult" type="checkbox">
        Show adult content for this browser session
      </label>
      <div class="settings-actions">
        <button type="submit">Save</button>
        <button id="close-settings" type="button">Close</button>
      </div>
    </form>
  </div>
  <script src="/static/vendor/hls.min.js"></script>
  <script src="/static/guide.js"></script>
</body>
</html>
