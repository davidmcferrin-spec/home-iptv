<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Library</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="library-page">
  <header class="library-bar">
    <a class="chip" href="/">Guide</a>
    <h1>Library</h1>
    <input id="library-search" type="search" placeholder="Search" aria-label="Search the library">
    <nav id="library-tabs">
      <button type="button" data-kind="show" aria-selected="true">TV</button>
      <button type="button" data-kind="movie">Movies</button>
      <button type="button" data-kind="file">Misc</button>
      <button type="button" data-kind="continue">Continue</button>
    </nav>
    <button id="open-library-settings" type="button">Settings</button>
  </header>
  <main id="library">
    <p id="library-error" class="library-error" hidden></p>
    <div id="poster-grid"></div>
    <section id="show-page" hidden></section>
    <aside id="details" hidden></aside>
    <section id="library-settings" class="library-card" hidden>
      <h2>Settings</h2>
      <p class="library-note">Libraries are folders under /media. Names, paths, and the TMDB key are stored in this app.</p>
      <p id="accel-status" class="library-note"></p>
      <div id="suggestions"></div>
      <form id="library-form">
        <label>Name
          <input id="lib-name" type="text" maxlength="120" required autocomplete="off">
        </label>
        <label>Path under /media
          <input id="lib-path" type="text" maxlength="400" required autocomplete="off" placeholder="TV">
        </label>
        <label>Type
          <select id="lib-kind">
            <option value="tv">TV</option>
            <option value="movies">Movies</option>
            <option value="misc">Misc</option>
          </select>
        </label>
        <button type="submit">Add library</button>
      </form>
      <div id="library-list"></div>
      <form id="tmdb-form">
        <label>TMDB API key
          <input id="tmdb-key" type="password" autocomplete="off" placeholder="Optional">
        </label>
        <button type="submit">Save key</button>
        <button id="tmdb-clear" type="button">Clear</button>
        <span id="tmdb-state"></span>
      </form>
    </section>
  </main>
  <div id="player" hidden>
    <video id="player-video" controls playsinline></video>
    <div id="player-bar">
      <label>Audio
        <select id="player-audio"></select>
      </label>
      <label>Subtitles
        <select id="player-subs"></select>
      </label>
      <button id="player-watched" type="button">Mark watched</button>
      <button id="player-close" type="button">Close</button>
    </div>
  </div>
  <script src="/static/vendor/hls.min.js"></script>
  <script src="/static/library.js"></script>
</body>
</html>
