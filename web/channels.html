<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Channels</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="channels-page">
  <div id="manager">
    <header class="manager-bar">
      <a class="chip" href="/">Guide</a>
      <h1 title="Select rows, then Bulk edit. Name and number save when you leave the cell. Arrow keys move, X selects, E edits, and / searches.">Channels</h1>
      <input id="q" type="search" placeholder="Search name or number" aria-label="Search channels">
      <select id="f-status" aria-label="Status">
        <option value="">Any status</option>
        <option value="online">Online</option>
        <option value="offline">Offline</option>
        <option value="unknown">Unchecked</option>
      </select>
      <select id="f-group" aria-label="Group">
        <option value="">Any group</option>
      </select>
      <select id="f-tag" aria-label="Tag">
        <option value="">Any tag</option>
      </select>
      <select id="f-country" aria-label="Country">
        <option value="">Any country</option>
      </select>
      <select id="f-sort" aria-label="Sort">
        <option value="number">Number</option>
        <option value="title">Name</option>
        <option value="group">Group</option>
        <option value="status">Status</option>
      </select>
      <label class="check"><input id="f-adult" type="checkbox"> Adult</label>
      <button id="select-matching" type="button">Select matching</button>
      <span id="channel-count"></span>
    </header>
    <div id="bulk-bar">
      <span id="bulk-count">0 selected</span>
      <button id="clear-selection" type="button" disabled>Clear</button>
      <button id="open-bulk" type="button" disabled>Bulk edit</button>
      <button id="undo" type="button">Undo</button>
    </div>
    <p id="loading" hidden>Loading channels...</p>
    <p id="result" role="status"></p>
    <div id="table-wrap">
      <p id="empty-state" hidden>No channels match. Add a playlist from the guide, or clear the filters.</p>
      <table id="channel-table">
        <colgroup>
          <col class="col-check">
          <col class="col-logo">
          <col class="col-number">
          <col class="col-name">
          <col class="col-group">
          <col class="col-status">
          <col class="col-tags">
          <col class="col-edit">
        </colgroup>
        <thead>
          <tr>
            <th><input id="select-page" type="checkbox" aria-label="Select this page"></th>
            <th>Logo</th>
            <th><span class="wide-label">Number</span><span class="short-label">No.</span></th>
            <th>Name</th>
            <th>Group</th>
            <th>Status</th>
            <th>Tags</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="manager-bar pager">
      <button id="prev-page" type="button">Previous</button>
      <span id="page-label"></span>
      <button id="next-page" type="button">Next</button>
    </div>
  </div>
  <aside id="drawer" hidden>
    <form id="drawer-form">
      <h2 id="drawer-title">Edit channel</h2>
      <section>
        <h3>Basics</h3>
        <label>Name <input id="d-title" type="text" maxlength="200"></label>
        <label>Number <input id="d-number" type="text" maxlength="16"></label>
        <label>Group <input id="d-group" type="text" maxlength="120"></label>
        <label>Logo URL <input id="d-logo" type="url"></label>
        <img id="d-logo-preview" alt="" width="64" height="64">
        <label>Notes <textarea id="d-notes" rows="3"></textarea></label>
        <label class="check"><input id="d-hidden" type="checkbox"> Hidden from the guide</label>
      </section>
      <section>
        <h3>Guide data</h3>
        <label>Guide match <input id="d-guide" type="text" list="guide-matches"></label>
        <datalist id="guide-matches"></datalist>
      </section>
      <section>
        <h3>Tags and classification</h3>
        <label>Tags <input id="d-tags" type="text" placeholder="News, Local"></label>
        <label>Language <input id="d-language" type="text" maxlength="16"></label>
        <label>Country <input id="d-country" type="text" maxlength="2"></label>
        <label class="check"><input id="d-adult" type="checkbox"> Adult</label>
      </section>
      <section>
        <h3>Playback</h3>
        <label>Mode
          <select id="d-playback">
            <option value="auto">Auto</option>
            <option value="webrtc">WebRTC</option>
            <option value="hls">HLS</option>
            <option value="transcode">Transcode</option>
          </select>
        </label>
      </section>
      <section>
        <h3>Source and status</h3>
        <label>URL <input id="d-url" type="text" readonly></label>
        <p id="d-probe"></p>
      </section>
      <p id="d-error" role="alert"></p>
      <div class="settings-actions">
        <button type="submit">Save</button>
        <button id="close-drawer" type="button">Cancel</button>
      </div>
    </form>
  </aside>
  <aside id="bulk-panel" hidden>
    <form id="bulk-form">
      <div class="bulk-head">
        <h2>Bulk edit</h2>
      </div>
      <div class="bulk-body">
      <label>Group
        <input id="b-group" type="text" placeholder="Leave unchanged">
      </label>
      <label class="check"><input id="b-clear-group" type="checkbox"> Clear group</label>
      <label>Add tags
        <input id="b-add-tags" type="text" placeholder="News, Sports">
      </label>
      <label>Remove tags
        <input id="b-remove-tags" type="text" placeholder="Old tag">
      </label>
      <label>Visibility
        <select id="b-hidden">
          <option value="">Leave visibility unchanged</option>
          <option value="hide">Hide from the guide</option>
          <option value="show">Show on the guide</option>
        </select>
      </label>
      <label>Favorites on this browser
        <select id="b-favorite">
          <option value="">Leave favorites unchanged</option>
          <option value="on">Favorite</option>
          <option value="off">Unfavorite</option>
        </select>
      </label>
      <label>Guide match
        <input id="b-guide" type="text" placeholder="Leave unchanged">
      </label>
      <label class="check"><input id="b-clear-guide" type="checkbox"> Clear guide match</label>
      <label>Renumber from
        <input id="b-renumber" type="number" min="0" step="1" placeholder="Leave numbers">
      </label>
      <p id="bulk-error" role="alert"></p>
      <div class="settings-actions">
        <button id="bulk-ask-delete" type="button">Delete</button>
      </div>
      <div id="bulk-confirm" hidden>
        <p id="bulk-confirm-text"></p>
        <div class="settings-actions">
          <button id="bulk-delete" type="button">Delete channels</button>
          <button id="bulk-cancel-delete" type="button">Back</button>
        </div>
      </div>
      </div>
      <div class="bulk-foot">
        <p id="bulk-preview"></p>
        <button type="submit">Apply</button>
        <button id="close-bulk" type="button">Cancel</button>
      </div>
    </form>
  </aside>
  <script src="/static/channels.js"></script>
</body>
</html>
